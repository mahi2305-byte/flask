<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add product</title>
</head>
<body>
    <h2>Add a product to {{ shop }}</h2>
    <!-- method="POST" sends the form data to the same /add route -->
    <form method="POST">
        <p>Name:  <input type="text" name="name" required></p>
        <p>Price: <input type="number" step="0.01" name="price" required></p>
        <p>Stock: <input type="number" name="stock" value="0" required></p>
        <button type="submit">Save</button>
    </form>
    <p><a href="{{ url_for('product') }}">Back to products</a></p>
</body>
</html>
