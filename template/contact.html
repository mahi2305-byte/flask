<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | {{ shop_name }}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f5f0; margin: 0; }
    nav { background: #16202e; color: white; padding: 16px; font-size: 20px; display: flex; gap: 16px; align-items: center; }
    nav a { color: white; text-decoration: none; }
    .container { padding: 30px 20px; max-width: 700px; margin: 0 auto; }
    .card { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    form { display: grid; gap: 16px; }
    label { font-weight: bold; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    textarea { min-height: 120px; resize: vertical; }
    button { background: #16202e; color: white; border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <span>{{ shop_name }}</span>
    <a href="/">Home</a>
    <a href="/contact">Contact Us</a>
  </nav>

  <div class="container">
    <div class="card">
      <h2>Contact Us</h2>
      <p>Have a question? Send us a message and we'll get back to you soon.</p>

      <form>
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name">
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>
</body>
</html>
